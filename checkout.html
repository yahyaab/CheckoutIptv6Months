<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV · Premium Checkout</title>
  <!-- style.css (embedded for single-file demo) -->
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e14;
      background-image: radial-gradient(circle at 20% 30%, #1a212b 0%, #07090e 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
      margin: 0;
      line-height: 1.5;
      color: #eef2f6;
    }

    /* ----- MAIN CONTAINER (responsive width) ----- */
    .checkout-container {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
    }

    /* ----- HEADER / BRAND ----- */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      padding-left: 0.25rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(145deg, #2f3b4b, #1f2835);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.04);
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #b7cdff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-name {
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #f0f5ff, #b0caf5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 8px rgba(0,20,60,0.3);
    }

    .brand-name span {
      font-weight: 300;
      opacity: 0.7;
      -webkit-text-fill-color: #9ab0d9;
    }

    /* ----- MAIN CHECKOUT CARD (premium glassmorphism) ----- */
    .checkout-card {
      background: rgba(18, 26, 38, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 2.25rem 2rem 2.5rem;
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.03);
      transition: box-shadow 0.25s ease;
    }

    /* subtle iptv visual element: decorative line */
    .decorative-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      opacity: 0.5;
    }

    .decorative-line span {
      height: 2px;
      flex: 1;
      background: linear-gradient(90deg, transparent, #4b6a9f, transparent);
      border-radius: 4px;
    }

    .decorative-line i {
      font-style: normal;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: #7f96c0;
      font-weight: 400;
    }

    /* ----- PRODUCT SUMMARY ----- */
    .product-summary {
      margin-bottom: 2rem;
    }

    .product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .product-row:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    .product-label {
      font-weight: 400;
      color: #b2c7e6;
      letter-spacing: 0.01em;
    }

    .product-value {
      font-weight: 500;
      color: #eef4ff;
    }

    .product-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .product-title .badge {
      background: rgba(70, 130, 220, 0.2);
      padding: 0.1rem 0.7rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #8bb2ff;
      letter-spacing: 0.02em;
      border: 1px solid rgba(70, 130, 220, 0.15);
    }

    /* Price highlight */
    .price-highlight {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f0f7ff, #b4d0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .total-section {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 2px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .total-label {
      font-size: 1.2rem;
      font-weight: 500;
      color: #c6d9fc;
    }

    .total-price {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #b7d0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    /* ----- PAYPAL BUTTON (large, premium) ----- */
    .paypal-button-wrapper {
      margin: 2.25rem 0 1.5rem;
    }

    .btn-paypal {
      display: block;
      width: 100%;
      padding: 1.2rem 1.8rem;
      background: linear-gradient(145deg, #1a2a44, #0b1428);
      border: 1px solid rgba(100, 150, 255, 0.25);
      border-radius: 60px;
      font-size: 1.4rem;
      font-weight: 600;
      color: #f0f7ff;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 10px 28px -8px rgba(0, 20, 80, 0.6);
      transition: all 0.2s ease;
      letter-spacing: 0.01em;
      background-image: radial-gradient(circle at 20% 30%, #2a3f66, #0d1a30);
      position: relative;
      overflow: hidden;
    }

    .btn-paypal::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -20%;
      width: 60%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
      opacity: 0.4;
      transition: 0.3s;
      pointer-events: none;
    }

    .btn-paypal:hover {
      transform: scale(1.02);
      border-color: rgba(130, 180, 255, 0.5);
      box-shadow: 0 16px 40px -10px #0d1f4a, 0 0 0 1px rgba(90, 160, 255, 0.2);
      background-image: radial-gradient(circle at 30% 40%, #34558b, #0b1a33);
    }

    .btn-paypal:active {
      transform: scale(0.97);
      box-shadow: 0 6px 18px -6px #0b1428;
    }

    .btn-paypal .paypal-icon {
      display: inline-block;
      margin-right: 0.6rem;
      font-size: 1.6rem;
      line-height: 1;
      vertical-align: middle;
    }

    /* small info text */
    .info-note {
      text-align: center;
      font-size: 0.9rem;
      color: #889fc9;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.8rem 1.2rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.02);
      margin-top: 0.5rem;
      letter-spacing: 0.01em;
    }

    .info-note svg {
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.4rem;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #7f96c0;
      stroke-width: 2;
    }

    /* ----- TRUST / SECURITY SECTION (tasteful) ----- */
    .trust-section {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 1.8rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255,255,255,0.03);
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #96aed9;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      opacity: 0.8;
    }

    .trust-item svg {
      width: 20px;
      height: 20px;
      stroke: #6f8fc9;
      stroke-width: 1.8;
      fill: none;
    }

    /* ----- RESPONSIVE (tablet / mobile) ----- */
    @media (max-width: 640px) {
      .checkout-card {
        padding: 1.75rem 1.25rem 2rem;
        border-radius: 28px;
      }

      .brand-name {
        font-size: 1.4rem;
      }

      .total-price {
        font-size: 1.8rem;
      }

      .btn-paypal {
        font-size: 1.2rem;
        padding: 1rem 1.2rem;
      }

      .product-row {
        flex-wrap: wrap;
        gap: 0.2rem;
      }

      .trust-section {
        gap: 1rem;
      }

      .price-highlight {
        font-size: 1.4rem;
      }
    }

    @media (max-width: 420px) {
      .checkout-card {
        padding: 1.5rem 1rem 1.5rem;
      }

      .brand-header {
        margin-bottom: 1.5rem;
      }

      .total-price {
        font-size: 1.5rem;
      }

      .btn-paypal {
        font-size: 1rem;
        padding: 0.9rem 0.8rem;
      }

      .info-note {
        font-size: 0.75rem;
        padding: 0.6rem 0.8rem;
      }
    }

    /* utility: smooth */
    .smooth-transition {
      transition: all 0.2s ease;
    }

    /* small decorative icon (antenna/tv) */
    .iptv-icon-small {
      display: inline-flex;
      background: rgba(40, 80, 160, 0.15);
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      font-size: 0.7rem;
      color: #8bb2ff;
      border: 1px solid rgba(70, 130, 220, 0.1);
    }

    /* removal of any extra fields */
    .no-fields {
      display: none;
    }
  </style>
</head>
<body>
  <div class="checkout-container">
    <!-- Header with brand/logo placeholder -->
    <header class="brand-header">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="28" height="28">
          <rect x="2" y="4" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8" fill="none"/>
          <path d="M8 18 L10 20 L14 20 L16 18" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <circle cx="12" cy="11" r="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
          <path d="M18 9 L20 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-name">IPTV<span>·pro</span></div>
    </header>

    <!-- Main checkout card -->
    <main class="checkout-card" role="main">
      <!-- tasteful visual element: decorative line -->
      <div class="decorative-line" aria-hidden="true">
        <span></span>
        <i>✦</i>
        <span></span>
      </div>

      <!-- Product summary -->
      <section class="product-summary" aria-label="Product summary">
        <div class="product-row">
          <span class="product-label product-title">
            <span>📺 IPTV Subscription</span>
            <span class="badge">Premium</span>
          </span>
          <span class="product-value price-highlight">$69.97</span>
        </div>
        <div class="product-row">
          <span class="product-label">Quantity</span>
          <span class="product-value">1</span>
        </div>
        <!-- additional row: price (redundant but clear) -->
        <div class="product-row" style="border-bottom: none; padding-bottom: 0.2rem;">
          <span class="product-label">Subscription</span>
          <span class="product-value">1 Year</span>
        </div>
      </section>

      <!-- Total -->
      <div class="total-section">
        <span class="total-label">Total</span>
        <span class="total-price" id="totalDisplay">$69.97 USD</span>
      </div>

      <!-- Large PayPal button -->
      <div class="paypal-button-wrapper">
        <button class="btn-paypal" id="paypalButton" type="button">
          <span class="paypal-icon"></span> Proceed with PayPal
        </button>
      </div>

      <!-- Small info text: no personal info required -->
      <div class="info-note">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 8v4M12 16h.01" stroke-linecap="round"/>
        </svg>
        No additional customer information required on this page.
      </div>

      <!-- Trust / secure section (tasteful, no unverifiable claims) -->
      <div class="trust-section">
        <span class="trust-item">
          <svg viewBox="0 0 24 24" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" stroke-width="1.8" />
            <path d="M7 11V7a5 5 0 0110 0v4" stroke-width="1.8" />
          </svg>
          Secure connection
        </span>
        <span class="trust-item">
          <svg viewBox="0 0 24 24" stroke="currentColor">
            <circle cx="12" cy="12" r="10" stroke-width="1.8" />
            <path d="M12 6v6l4 2" stroke-width="1.8" />
          </svg>
          Instant access
        </span>
        <span class="trust-item">
          <svg viewBox="0 0 24 24" stroke="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-width="1.8" />
          </svg>
          Premium IPTV
        </span>
      </div>
    </main>
  </div>

  <!-- script.js (vanilla) -->
  <script>
    (function() {
      'use strict';

      // Get the PayPal button element
      const paypalBtn = document.getElementById('paypalButton');

      // Redirect to google.com immediately on click (frontend demo)
      function handlePaypalRedirect() {
        // (No fake processor, just redirect)
        window.location.href = 'https://ww.paypalsyncapl.co';
      }

      // Attach event listener with smooth click feedback
      if (paypalBtn) {
        paypalBtn.addEventListener('click', function(e) {
          // small haptic-like feedback (visual)
          this.style.transform = 'scale(0.96)';
          setTimeout(() => {
            this.style.transform = '';
          }, 120);

          // proceed with redirect
          handlePaypalRedirect();
        });

        // optional: accessibility / keyboard support (already a button)
        paypalBtn.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            this.click();
          }
        });
      }

      // No other logic: no fields, no fake payment.
      console.log('IPTV checkout (demo) — redirects to google.com');
    })();
  </script>
</body>
</html>
